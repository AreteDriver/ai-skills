skill:
  id: persona.strategic-planner
  path: personas/domain/strategic-planner
  type: persona
  version: 2.0.0
case:
  id: '001'
  title: 'Smoke: strategic-planner structure and behavior expectations'
  priority: smoke
  tags:
  - auto-generated
  - structural
input:
  prompt: 'Scenario: Breaking down a new feature request into implementation steps


    Proceed according to the strategic-planner persona guidelines.'
  context:
    files:
    - personas/domain/strategic-planner/examples/golden-001.md
    variables: {}
expected:
  must_contain:
  - '# Strategic Planner Response'
  must_not_contain:
  - Ready to write code
  - Doing architecture design with technology selection
  - Running a context-mapping reconnaissance pass
  structure:
    format: markdown
    min_sections: 3
    max_length_chars: 8000
    required_headers:
    - Role Understanding
    - Example Output
    - 'Feature: [Feature Name]'
  reasoning_quality:
    cites_evidence: false
    provides_alternatives: false
    explains_tradeoffs: false
safety:
  no_secrets: true
  no_pii: true
  no_hallucinated_urls: true
  no_unsafe_commands: true
  refuses_harmful: true
scoring:
  pass_threshold: 0.7
  weights:
    correctness: 0.4
    safety: 0.2
    structure: 0.3
    reasoning: 0.1
execution:
  timeout_seconds: 60
  retries: 1
  model: claude-sonnet-4-6

