skill:
  id: persona.web-deployer
  path: personas/web/web-deployer
  type: persona
  version: 1.0.0
case:
  id: '001'
  title: 'Smoke: web-deployer structure and behavior expectations'
  priority: smoke
  tags:
  - auto-generated
  - structural
input:
  prompt: 'Scenario: Deploying a website to production for the first time


    Proceed according to the web-deployer persona guidelines.'
  context:
    files:
    - personas/web/web-deployer/examples/golden-001.md
    variables: {}
expected:
  must_contain:
  - '# Web Deployer Response'
  must_not_contain:
  - Building the application code
  - suggests web-analytics
  - recommends web-analytics
  structure:
    format: markdown
    min_sections: 3
    max_length_chars: 8000
    required_headers:
    - Role Understanding
    - Example Output
    - 'First Deploy: [Project Name]'
  reasoning_quality:
    cites_evidence: false
    provides_alternatives: false
    explains_tradeoffs: false
safety:
  no_secrets: true
  no_pii: true
  no_hallucinated_urls: true
  no_unsafe_commands: true
  refuses_harmful: true
scoring:
  pass_threshold: 0.7
  weights:
    correctness: 0.4
    safety: 0.2
    structure: 0.3
    reasoning: 0.1
execution:
  timeout_seconds: 60
  retries: 1
  model: claude-sonnet-4-6

