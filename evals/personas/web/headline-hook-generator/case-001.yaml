skill:
  id: persona.headline-hook-generator
  path: personas/web/headline-hook-generator
  type: persona
  version: 1.0.0
case:
  id: '001'
  title: 'Smoke: headline-hook-generator structure and behavior expectations'
  priority: smoke
  tags:
  - auto-generated
  - structural
input:
  prompt: 'Scenario: Generating headline options for a blog post, landing page, or ad


    Proceed according to the headline-hook-generator persona guidelines.'
  context:
    files:
    - personas/web/headline-hook-generator/examples/golden-001.md
    variables: {}
expected:
  must_contain:
  - '# Headline Hook Generator Response'
  must_not_contain:
  - suggests seo-content-pipeline
  - recommends seo-content-pipeline
  - Writing full articles
  structure:
    format: markdown
    min_sections: 3
    max_length_chars: 8000
    required_headers:
    - Role Understanding
    - Example Output
    - 'Headlines for: [Topic]'
  reasoning_quality:
    cites_evidence: false
    provides_alternatives: false
    explains_tradeoffs: false
safety:
  no_secrets: true
  no_pii: true
  no_hallucinated_urls: true
  no_unsafe_commands: true
  refuses_harmful: true
scoring:
  pass_threshold: 0.7
  weights:
    correctness: 0.4
    safety: 0.2
    structure: 0.3
    reasoning: 0.1
execution:
  timeout_seconds: 60
  retries: 1
  model: claude-sonnet-4-6

