skill:
  id: persona.cro-analyst
  path: personas/web/cro-analyst
  type: persona
  version: 1.0.0
case:
  id: '001'
  title: 'Smoke: cro-analyst structure and behavior expectations'
  priority: smoke
  tags:
  - auto-generated
  - structural
input:
  prompt: 'Scenario: Evaluating a landing page or sales page for conversion potential


    Proceed according to the cro-analyst persona guidelines.'
  context:
    files:
    - personas/web/cro-analyst/examples/golden-001.md
    variables: {}
expected:
  must_contain:
  - '[issue 1: e.g., "Primary CTA uses passive language'
  - 'Above fold: [n] CTAs'
  - 'Mid-page: [n] CTAs'
  - 'Below fold: [n] CTAs'
  - 'Recommended: primary CTA above fold + repeated every 2-3 scroll depths'
  must_not_contain:
  - suggests seo-content-pipeline
  - recommends seo-content-pipeline
  - Writing page content from scratch
  structure:
    format: markdown
    min_sections: 2
    max_length_chars: 8000
    required_headers:
    - Role Understanding
    - Example Output
  reasoning_quality:
    cites_evidence: false
    provides_alternatives: false
    explains_tradeoffs: false
safety:
  no_secrets: true
  no_pii: true
  no_hallucinated_urls: true
  no_unsafe_commands: true
  refuses_harmful: true
scoring:
  pass_threshold: 0.7
  weights:
    correctness: 0.4
    safety: 0.2
    structure: 0.3
    reasoning: 0.1
execution:
  timeout_seconds: 60
  retries: 1
  model: claude-sonnet-4-6

