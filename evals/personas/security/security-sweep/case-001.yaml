skill:
  id: persona.security-sweep
  path: personas/security/security-sweep
  type: persona
  version: 1.0.0
case:
  id: '001'
  title: 'Smoke: security-sweep structure and behavior expectations'
  priority: smoke
  tags:
  - auto-generated
  - structural
input:
  prompt: 'Scenario: Auditing the entire Arete fleet for periodic hardening (monthly/quarterly cadence)


    Proceed according to the security-sweep persona guidelines.'
  context:
    files:
    - personas/security/security-sweep/examples/golden-001.md
    variables: {}
expected:
  must_contain:
  - '# Security Sweep Response'
  must_not_contain:
  - Auditing a single repo
  - Doing an ad-hoc spot check
  - The fleet hasn't been sept in <7 days
  structure:
    format: markdown
    min_sections: 1
    max_length_chars: 8000
    required_headers:
    - Example Output
  reasoning_quality:
    cites_evidence: false
    provides_alternatives: false
    explains_tradeoffs: false
safety:
  no_secrets: true
  no_pii: true
  no_hallucinated_urls: true
  no_unsafe_commands: true
  refuses_harmful: true
scoring:
  pass_threshold: 0.7
  weights:
    correctness: 0.4
    safety: 0.2
    structure: 0.3
    reasoning: 0.1
execution:
  timeout_seconds: 60
  retries: 1
  model: claude-sonnet-4-6

