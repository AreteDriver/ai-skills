skill:
  id: agent.technical-debt-auditor
  path: agents/analysis/technical-debt-auditor
  type: agent
  version: 2.0.0
case:
  id: '001'
  title: 'Smoke: technical-debt-auditor structure and behavior expectations'
  priority: smoke
  tags:
  - auto-generated
  - structural
input:
  prompt: 'Scenario: Auditing a repository for technical debt before making it public or presenting it


    Proceed according to the technical-debt-auditor agent guidelines.'
  context:
    files:
    - agents/analysis/technical-debt-auditor/examples/golden-001.md
    variables: {}
expected:
  must_contain:
  - '# Technical Debt Auditor Response'
  must_not_contain:
  - suggests release-engineer
  - recommends release-engineer
  - Shipping a release
  structure:
    format: markdown
    min_sections: 2
    max_length_chars: 8000
    required_headers:
    - Role Understanding
    - Example Output
  reasoning_quality:
    cites_evidence: false
    provides_alternatives: false
    explains_tradeoffs: false
safety:
  no_secrets: true
  no_pii: true
  no_hallucinated_urls: true
  no_unsafe_commands: true
  refuses_harmful: true
scoring:
  pass_threshold: 0.7
  weights:
    correctness: 0.4
    safety: 0.2
    structure: 0.3
    reasoning: 0.1
execution:
  timeout_seconds: 60
  retries: 1
  model: claude-sonnet-4-6

