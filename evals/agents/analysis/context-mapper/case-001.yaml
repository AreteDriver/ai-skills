skill:
  id: agent.context-mapper
  path: agents/analysis/context-mapper
  type: agent
  version: 2.0.0
case:
  id: '001'
  title: 'Smoke: context-mapper structure and behavior expectations'
  priority: smoke
  tags:
  - auto-generated
  - structural
input:
  prompt: 'Scenario: Starting any Gorgon workflow that involves multiple agents operating on the same codebase or corpus


    Proceed according to the context-mapper agent guidelines.'
  context:
    files:
    - agents/analysis/context-mapper/examples/golden-001.md
    variables: {}
expected:
  must_contain:
  - '# Context Mapper Response'
  must_not_contain:
  - You already have a fresh context map less than 1 hour old for the same project
  - The task operates on a single known file with no cross-cutting concerns
  - You need to understand a specific function or class, not the whole project
  structure:
    format: markdown
    min_sections: 2
    max_length_chars: 8000
    required_headers:
    - Role Understanding
    - Example Output
  reasoning_quality:
    cites_evidence: false
    provides_alternatives: false
    explains_tradeoffs: false
safety:
  no_secrets: true
  no_pii: true
  no_hallucinated_urls: true
  no_unsafe_commands: true
  refuses_harmful: true
scoring:
  pass_threshold: 0.7
  weights:
    correctness: 0.4
    safety: 0.2
    structure: 0.3
    reasoning: 0.1
execution:
  timeout_seconds: 60
  retries: 1
  model: claude-sonnet-4-6

