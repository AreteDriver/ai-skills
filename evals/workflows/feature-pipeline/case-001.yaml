skill:
  id: workflow.feature-pipeline
  path: workflows/feature-pipeline
  type: workflow
  version: 1.0.0
case:
  id: '001'
  title: 'Smoke: feature-pipeline structure and behavior expectations'
  priority: smoke
  tags:
  - auto-generated
  - structural
input:
  prompt: 'Scenario: Implementing a feature that touches multiple layers (backend, frontend, tests, docs)


    Proceed according to the feature-pipeline workflow guidelines.'
  context:
    files:
    - workflows/feature-pipeline/examples/golden-001.md
    variables: {}
expected:
  must_contain:
  - '# Feature Pipeline Response'
  must_not_contain:
  - The change is backend-only or frontend-only
  - suggests conductor
  - recommends conductor
  structure:
    format: markdown
    min_sections: 2
    max_length_chars: 8000
    required_headers:
    - Role Understanding
    - Example Output
  reasoning_quality:
    cites_evidence: false
    provides_alternatives: false
    explains_tradeoffs: false
safety:
  no_secrets: true
  no_pii: true
  no_hallucinated_urls: true
  no_unsafe_commands: true
  refuses_harmful: true
scoring:
  pass_threshold: 0.7
  weights:
    correctness: 0.4
    safety: 0.2
    structure: 0.3
    reasoning: 0.1
execution:
  timeout_seconds: 60
  retries: 1
  model: claude-sonnet-4-6

