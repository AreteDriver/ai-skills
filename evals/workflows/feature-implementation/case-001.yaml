skill:
  id: workflow.feature-implementation
  path: workflows/feature-implementation
  type: workflow
  version: 2.0.0
case:
  id: '001'
  title: 'Smoke: feature-implementation structure and behavior expectations'
  priority: smoke
  tags:
  - auto-generated
  - structural
input:
  prompt: 'Scenario: Implementing a complete feature that spans multiple files


    Proceed according to the feature-implementation workflow guidelines.'
  context:
    files:
    - workflows/feature-implementation/examples/golden-001.md
    variables: {}
expected:
  must_contain:
  - '# Feature Implementation Response'
  must_not_contain:
  - Making a small bug fix or single-file change
  - Only need context mapping without implementation
  - Only need a plan without execution
  structure:
    format: markdown
    min_sections: 2
    max_length_chars: 8000
    required_headers:
    - Role Understanding
    - Example Output
  reasoning_quality:
    cites_evidence: false
    provides_alternatives: false
    explains_tradeoffs: false
safety:
  no_secrets: true
  no_pii: true
  no_hallucinated_urls: true
  no_unsafe_commands: true
  refuses_harmful: true
scoring:
  pass_threshold: 0.7
  weights:
    correctness: 0.4
    safety: 0.2
    structure: 0.3
    reasoning: 0.1
execution:
  timeout_seconds: 60
  retries: 1
  model: claude-sonnet-4-6

