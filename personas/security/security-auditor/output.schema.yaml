# Security Auditor Output Schema
# Defines expected structure for security audit reports.

schema_version: "2.0.0"  # bumped 2026-05-10 for SAST + triage fields

audit_report:
  metadata:
    date:
      type: string
      format: ISO8601
      required: true
    scope:
      type: string
      required: true
      description: What was reviewed (repo, files, components)
    risk_rating:
      type: enum
      values: [critical, high, medium, low]
      required: true
      description: Overall risk posture of the audited code
    mode:
      type: array
      items:
        type: enum
        values: [default, quick, diff, ollama, patches, sast-only]
      required: true
      description: Which flags were active for this run
    tool_inventory:
      type: object
      required: true
      description: Which SAST tools were available/missing at scan time
      properties:
        semgrep: {type: enum, values: [available, missing]}
        bandit: {type: enum, values: [available, missing]}
        gitleaks: {type: enum, values: [available, missing]}
        pip_audit: {type: enum, values: [available, missing]}
        npm_audit: {type: enum, values: [available, missing]}
        cargo_audit: {type: enum, values: [available, missing]}
        trivy: {type: enum, values: [available, missing, not_applicable]}

  executive_summary:
    type: string
    required: true
    max_length: 500
    description: 2-3 sentences covering posture, biggest risks, key action

  findings:
    type: array
    items:
      fingerprint:
        type: string
        required: true
        format: "{file}:{enclosing_function}:{rule_id}:{pattern_hash}"
        description: Stable across line-number shifts — used for --diff mode matching
      severity:
        type: enum
        values: [critical, high, medium, low, info]
        required: true
      title:
        type: string
        required: true
      location:
        type: string
        format: "file_path:line_start-line_end (function: name)"
        required: true
      source:
        type: object
        required: true
        properties:
          tool:
            type: enum
            values: [semgrep, bandit, gitleaks, pip-audit, npm-audit, cargo-audit, trivy, grep, manual]
          rule_id:
            type: string
            description: Tool-native rule identifier (e.g., semgrep `python.django.security.sqli`)
          rule_pack:
            type: string
            description: Rule pack name (e.g., semgrep `auto`, bandit `B608`)
      category:
        type: string
        description: "OWASP category (e.g., A01: Broken Access Control)"
        required: true
      triage:
        type: object
        required: true
        description: Output of Phase 4 LLM triage
        properties:
          reality:
            type: enum
            values: [real, false-positive, requires-runtime-test]
            required: true
          confidence:
            type: enum
            values: [high, medium, low]
            required: true
          reasoning:
            type: string
            required: true
            description: Why the triage classified this way (1 paragraph)
          model:
            type: enum
            values: [claude-sonnet, claude-opus, qwen2.5:14b, gpt-5]
            description: Which model performed the triage
      description:
        type: string
        required: true
      impact:
        type: string
        required: true
        description: What an attacker could do if this is exploited
      evidence:
        type: string
        description: Vulnerable code snippet
      remediation:
        type: string
        required: true
        description: Fixed code snippet or specific remediation steps
      patch:
        type: string
        format: unified-diff
        description: Optional unified-diff patch (only when --patches flag set + triage.reality=real)
      effort:
        type: enum
        values: [low, medium, high]
        required: true
      diff_status:
        type: enum
        values: [new, unchanged, regressed, resolved]
        description: Only present in --diff mode. Compares against previous SECURITY_FINDINGS.md

  positive_observations:
    type: array
    items:
      type: string
    required: true
    min_items: 1

  dependency_vulnerabilities:
    type: array
    items:
      package:
        type: string
      version:
        type: string
      cve:
        type: string
      severity:
        type: enum
        values: [critical, high, medium, low]
      fix_version:
        type: string

  secrets_found:
    type: array
    items:
      type:
        type: string
      location:
        type: string
      status:
        type: enum
        values: [active, example, revoked, unknown]

  recommendations:
    type: array
    required: true
    items:
      priority:
        type: enum
        values: [immediate, this_sprint, this_quarter, ongoing]
      action:
        type: string

  out_of_scope:
    type: array
    items:
      type: string
    description: What was not reviewed and why

# Severity calibration
severity_rubric:
  critical:
    exploitability: "Easy, no authentication needed"
    impact: "Full system compromise, RCE, mass data breach"
    examples:
      - "SQL injection in login endpoint"
      - "Remote code execution via unsanitized input"
      - "Hardcoded AWS root credentials"
    response: "Fix before next deployment"

  high:
    exploitability: "Requires some access or knowledge"
    impact: "Data breach, privilege escalation, account takeover"
    examples:
      - "IDOR allowing access to other users' data"
      - "Broken authentication (no session expiry, weak JWT)"
      - "Stored XSS in user-generated content"
    response: "Fix this sprint"

  medium:
    exploitability: "Complex to exploit or limited blast radius"
    impact: "Limited data exposure, partial compromise"
    examples:
      - "Reflected XSS requiring user interaction"
      - "Weak password hashing (MD5/SHA1)"
      - "Missing rate limiting on auth endpoints"
    response: "Fix this quarter"

  low:
    exploitability: "Theoretical or very difficult"
    impact: "Minimal direct impact"
    examples:
      - "Missing security headers (X-Frame-Options)"
      - "Verbose error messages leaking stack traces"
      - "Cookie without Secure flag in development"
    response: "Address when convenient"

  info:
    exploitability: "Not exploitable"
    impact: "No direct security impact"
    examples:
      - "Server version disclosed in headers"
      - "Best practice suggestion (CSP policy)"
    response: "Track for continuous improvement"
