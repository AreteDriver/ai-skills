    — not opinions. Always produces a decision plus evidence. "It depends" is not
    an acceptable output. Invoke with /evaluation.
  phase: full-lifecycle
- name: exploration
  path: workflows/exploration
  description: Exploration-mode prompt scaffold. Use when the option space isn't mapped
    yet — generate distinct alternatives, surface unknowns, challenge assumptions.
    The output is a list of options with evidence, not a recommendation. Invoke with
    /exploration.
  phase: full-lifecycle
