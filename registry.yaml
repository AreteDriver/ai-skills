schema_version: 1.0.0
repository: AreteDriver/ai-skills
personas:
  api:
  - name: api-tester
    path: personas/api/api-tester
    description: REST and GraphQL API testing — contract validation, load testing,
      regression suites, and endpoint verification
    tags:
    - api
    - data
    - database
    - design
    - low
    - openapi
    - performance
    - persona
    - testing
    triggers:
    - analyze failure patterns (timing, ordering, state leakage)
    - build ci-friendly comparison with clear failure messages
    - building contract test suites (consumer-driven or provider)
    - capture baseline responses as golden files (sanitize timestamps, ids)
    - check for shared mutable state between tests
    - configure virtual user profiles with realistic think times
    - creating regression test baselines with golden file comparison
    - debugging flaky api tests or intermittent failures
    - define slos (p50, p95, p99 latency targets, error rate thresholds)
    - design diff strategies (structural vs exact match)
    - design workload scenarios (ramp-up, steady state, spike)
    - flag undocumented endpoints or response codes
    - generate request/response pairs covering all documented schemas
    - handle expected schema evolution vs unexpected changes
    - identify resource bottlenecks from test results
    - parse the openapi spec and identify all endpoints
    - recommend retry strategies only as last resort
    - reviewing api test coverage gaps
    - setting up load/stress testing with k6 or artillery
    - use tools like schemathesis, dredd, or pact for automated validation
  - name: database-ops
    path: personas/api/database-ops
    description: Database operations — schema design, migration authoring, query optimization,
      and SQL/ORM patterns
    tags:
    - api
    - data
    - database
    - deployment
    - design
    - low
    - migration
    - performance
    - persona
    - review
    - sqlite
    - visualization
    triggers:
    - ask about cardinality (1:1, 1:n, m:n) for relationships
    - calculate index selectivity before suggesting new indexes
    - check for data-dependent migrations (backfill before constraint)
    - check for n+1 query patterns in orm code
    - check lock ordering and transaction scope
    - choosing between orm patterns and raw sql
    - consider partial indexes for filtered queries
    - debugging deadlocks, lock contention, or connection pool issues
    - design for soft deletes vs hard deletes based on requirements
    - designing database schemas (tables, indexes, constraints, relationships)
    - draw ascii erd for visualization
    - generate both upgrade and downgrade functions
    - identify long-running transactions holding locks
    - identify sequential scans on large tables
    - include created_at/updated_at timestamps by default
    - include safety checks (idempotent operations where possible)
    - optimizing slow queries with explain analyze
    - planning data model changes for existing production databases
    - propose column types with explicit sizing (varchar(255), not text unless needed)
    - recommend covering indexes for frequent query patterns
  - name: oauth-integrator
    path: personas/api/oauth-integrator
    description: OAuth and API authentication — OAuth 2.0 flows, PKCE, token lifecycle,
      JWT validation, and provider integration
    tags:
    - api
    - architecture
    - debugging
    - design
    - frontend
    - jwt
    - low
    - migration
    - mobile
    - oauth
    - persona
    - security
    - web
    triggers:
    - audit current auth implementation for security gaps
    - build token exchange endpoint
    - build user migration path (re-auth vs silent migration)
    - check for common provider-specific gotchas
    - check token expiration and clock skew
    - choose between session-based and stateless jwt approaches
    - confirm scope grants match requested scopes
    - debugging oauth redirect loops, token errors, or scope issues
    - decode the jwt and inspect all claims (without verifying — just for debugging)
    - design backward-compatible token validation (accept old + new)
    - design scope hierarchy and permission model
    - design token lifecycle (issuance → refresh → revocation → cleanup)
    - designing token refresh and revocation strategies
    - generate state parameter for csrf protection
    - identify the correct flow for the client type (web/mobile/server/cli)
    - implement pkce (code_verifier + code_challenge with s256)
    - implementing oauth 2.0 flows (authorization code, pkce, client credentials)
    - integrating third-party oauth providers (google, github, discord, eve online
      sso
    - migrating between authentication systems
    - plan migration with zero-downtime token transition
  - name: webhook-designer
    path: personas/api/webhook-designer
    description: Webhook architecture — payload design, retry strategies, HMAC signature
      verification, and event-driven patterns
    tags:
    - api
    - data
    - debugging
    - design
    - go
    - low
    - migration
    - monitoring
    - persona
    - python
    - security
    triggers:
    - add circuit breaker for consistently failing endpoints
    - building retry logic with exponential backoff and dead letter queues
    - debugging webhook delivery failures or duplicate processing
    - deduplicate by event id (idempotency table)
    - 'define event taxonomy (resource.action pattern: `order.created`, `user.updated`)'
    - defining webhook event schemas and versioning strategies
    - design envelope format (id, type, timestamp, version, data)
    - design idempotency key strategy for receivers
    - 'design retry schedule (exponential backoff: 1m, 5m, 30m, 2h, 12h)'
    - designing webhook sender/receiver architecture
    - determine subscription model (topic-based, filter expressions)
    - generate per-subscriber signing secrets (rotate-able)
    - handle out-of-order delivery gracefully
    - implement dead letter queue for permanently failed deliveries
    - implement event replay capability for recovery
    - implement hmac-sha256 signing (timestamp + payload body)
    - implementing hmac signature verification for webhook payloads
    - include timestamp in signature to prevent replay attacks (5-minute window)
    - plan schema versioning strategy (url path vs header vs envelope field)
    - provide verification code in python, node.js, and go
