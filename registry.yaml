- name: agent-pipeline
  path: workflows/agent-pipeline
  description: Automated Issue-to-PR-to-Merge pipeline using GitHub Actions and AI
    agents with review loops
  has_schema: true
  phase: full-lifecycle
  tags:
  - automation
  - medium
  - workflow
  triggers:
  - adding ci/cd automation where ai agents handle implementation from issues
  - configuring the issue → pr → review → merge pipeline
  - repos with well-defined issue templates and coding conventions (claude.md)
  - setting up automated agent implementation in a github repository
- name: conductor
  path: workflows/conductor
  description: Context-driven development workflow — interactive setup, spec generation,
    TDD implementation with checkpoints and revert
  phase: full-lifecycle
  tags:
  - development
  - medium
  - workflow
  triggers:
  - managing multiple feature tracks with prioritization
  - planning and implementing a feature that spans multiple files or concerns
  - starting a new project and need to establish foundational artifacts (product.md,
  - you need the ability to revert by logical unit (track, phase, or task)
  - you want tdd-driven implementation with explicit user approval between phases
- name: context-mapping
  path: workflows/context-mapping
  description: Pre-execution context mapping phase inspired by Blitzy — maps codebase
    structure, identifies dependencies, and builds execution context before any agent
    writes code. Use before complex multi-file changes, large refactors, or unfamiliar
    codebases.
  has_schema: true
  phase: full-lifecycle
  tags:
  - analysis
  - data
  - express
  - medium
  - typescript
  - workflow
  triggers:
  - '"question or ambiguity that needs resolution"'
  - multiple agents or changes might interact with the same files
  - planning multi-file changes that touch shared dependencies
  - starting a complex task in an unfamiliar or large codebase
  - you need to validate assumptions about codebase conventions before execution
- name: evaluation
  path: workflows/evaluation
  description: Evaluation-mode prompt scaffold. Use when you have candidates (options,
    outputs, PRs, copy variants, vendors) and need a scored comparison with a verdict
    — not opinions. Always produces a decision plus evidence. "It depends" is not
    an acceptable output. Invoke with /evaluation.
  phase: full-lifecycle
  tags:
  - bash
- name: exploration
  path: workflows/exploration
  description: Exploration-mode prompt scaffold. Use when the option space isn't mapped
    yet — generate distinct alternatives, surface unknowns, challenge assumptions.
    The output is a list of options with evidence, not a recommendation. Invoke with
    /exploration.
  phase: full-lifecycle
  tags:
  - bash
- name: feature-implementation
  path: workflows/feature-implementation
  description: End-to-end feature implementation workflow using WHY/WHAT/HOW framework
    — from requirements through context mapping, implementation, testing, and PR creation.
    Use when implementing a complete feature across multiple files.
  has_schema: true
  phase: full-lifecycle
  tags:
  - engineering
  - medium
  - workflow
  triggers:
  - coordinating multiple agents or personas through a structured pipeline
  - implementing a complete feature that spans multiple files
  - the work requires context mapping, design, implementation, testing, and pr deliv
  - you need quality gates between phases to catch issues early
- name: feature-pipeline
  path: workflows/feature-pipeline
  description: Multi-phase feature development with checkpoint gates, parallel agent
    streams, and phased artifact output
  phase: full-lifecycle
  tags:
  - development
  - medium
  - workflow
  triggers:
  - clean revert per phase is important
  - implementing a feature that touches multiple layers (backend, frontend, tests,
    d
  - the feature needs a security and performance review before delivery
  - you need numbered output artifacts for traceability
  - you want parallel agent execution for backend, frontend, and test writing
- name: goal
  path: workflows/goal
  description: Manage the build-mode goal-loop — set, inspect, pause, resume, extend,
    or clear a durable build objective with a budget ceiling. Drives the goal-loop
    + goal-gate hooks via a repo-root .goal-active sentinel. Invoke with /goal.
  phase: full-lifecycle
- name: production
  path: workflows/production
  description: Production-mode prompt scaffold. Use when the decision is made and
    spec is clear — produce the final deliverable with no exploratory sprawl, no meta-commentary,
    no preamble. Output is the artifact itself, nothing else. Invoke with /production.
  phase: full-lifecycle
  tags:
  - bash
