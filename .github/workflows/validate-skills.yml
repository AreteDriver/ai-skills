name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate All Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python YAML parser
        run: pip install pyyaml

      - name: Make scripts executable
        run: chmod +x ./tools/*.sh

      - name: Run skill validation
        run: ./tools/validate-skills.sh --verbose

      - name: Run format check
        run: ./tools/format-check.sh --verbose

  strict:
    name: Strict Catalog Validation
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: pip install pyyaml pytest

      - name: Run catalog drift tests
        run: python3 -m pytest tests/test_catalog_drift.py -v --tb=short

      - name: Verify registry freshness
        run: |
          python3 scripts/reconcile-registry.py
          git diff --exit-code registry.yaml || {
            echo "::error::registry.yaml is stale. Run 'python3 scripts/reconcile-registry.py' and commit."
            exit 1
          }
