name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate All Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python YAML parser
        run: pip install pyyaml

      - name: Make scripts executable
        run: chmod +x ./tools/*.sh

      - name: Run skill validation
        run: ./tools/validate-skills.sh --verbose

      - name: Run format check
        run: ./tools/format-check.sh --verbose

  strict:
    name: Strict Catalog Validation
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: pip install pyyaml pytest

      - name: Run catalog drift tests
        run: python3 -m pytest tests/test_catalog_drift.py -v --tb=short

      - name: Verify generated output freshness
        run: |
          python3 scripts/generate-manifests.py
          python3 scripts/generate-registry.py
          python3 scripts/generate-docs.py
          git diff --exit-code manifests/ registry.yaml docs/generated/ || {
            echo "::error::Generated output is stale. Run the generation pipeline and commit:"
            echo "  python3 scripts/generate-manifests.py"
            echo "  python3 scripts/generate-registry.py"
            echo "  python3 scripts/generate-docs.py"
            exit 1
          }

  evals:
    name: Behavioral Quality Evals
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run evals on all skills (golden)
        run: python3 scripts/run-evals.py --all --report

      - name: Check eval coverage gate
        run: python3 scripts/check-eval-coverage.py --threshold 0.90

      - name: Upload golden quality card
        uses: actions/upload-artifact@v7
        with:
          name: eval-quality-card-golden
          path: evals/reports/quality-card-golden.md

      - name: Run lifecycle audit
        run: python3 scripts/lifecycle-manager.py audit

      - name: Run installer integration tests
        run: python3 -m pytest tests/test_installer.py -v --tb=short

  live_evals:
    name: Live Evals (Anthropic API)
    runs-on: ubuntu-latest
    needs: validate
    if: github.repository_owner == 'AreteDriver'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run critical evals in live mode
        run: python3 scripts/run-evals.py --all --mode live --report
        if: env.ANTHROPIC_API_KEY != ''

      - name: Upload live quality card
        uses: actions/upload-artifact@v7
        if: env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-quality-card-live
          path: evals/reports/quality-card-live.md

      - name: Skip live evals (no API key)
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "Skipping live evals — ANTHROPIC_API_KEY not configured"
